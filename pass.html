<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#b3122e" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="शुभविवाह" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <title>अतिथि पास · Guest Pass</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="css/ops.css" />
  <link rel="stylesheet" href="css/ux.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🪔 शुभविवाह</div>
    <nav>
      <a href="index.html" data-guest-link data-icon="🏠" data-i18n="nav.home">Home</a>
      <a href="register.html" data-guest-link data-icon="📝" data-i18n="nav.register">Register</a>
      <a href="photos.html" data-guest-link data-icon="📷" data-i18n="nav.photos" data-feature="feature.media">Photos</a>
      <a href="games.html" data-guest-link data-icon="🎲" data-i18n="nav.games" data-feature="feature.games">Games</a>
      <a href="gift.html" data-guest-link data-icon="🎁" data-i18n="nav.gift" data-feature="feature.gifts">Gift</a>
      <a href="pass.html" data-guest-link data-icon="🎫" data-i18n="nav.pass" class="current">My Pass</a>
      <a href="memorial.html" data-guest-link data-icon="🪔" data-i18n="nav.memorial" id="navMemorial">In Memory of Mom</a>
    </nav>
    <div class="lang-switch" id="langSwitch"></div>
  </header>

  <main>
    <div id="msg" class="msg" hidden></div>
    <section id="pass" class="card pass" hidden>
      <h2 data-i18n="pass.title">Guest Pass</h2>
      <h3 id="pName"></h3>
      <div><span id="pSide" class="side-tag"></span></div>
      <p id="pRelation"></p>
      <div class="qr qr-scan" id="pQr"></div>
      <p class="muted" data-i18n="pass.showAtEntry"></p>
      <p class="brightness-tip">☀️ <span data-i18n="pass.brightness">Turn up phone brightness for faster scanning.</span></p>
      <p><b data-i18n="pass.people"></b>: <span id="pPeople"></span></p>
      <p id="pTableRow" hidden><b data-i18n="pass.table"></b>: <span id="pTable"></span></p>
      <p id="pRoomRow" hidden><b data-i18n="pass.room"></b>: <span id="pRoom"></span></p>
      <p id="pBandRow" hidden><b data-i18n="pass.band"></b>: <span id="pBand" class="band"></span></p>
      <p class="no-print"><button class="btn ghost sm" onclick="window.print()">🖨️</button></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pass.js"></script>
</body>
</html>
