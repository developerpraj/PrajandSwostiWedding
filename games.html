<body>
  <header class="topbar">
    <div class="brand">🪔 शुभविवाह</div>
    <nav>
      <a href="index.html" data-guest-link data-icon="🏠" data-i18n="nav.home">Home</a>
      <a href="photos.html" data-guest-link data-icon="📷" data-i18n="nav.photos" data-feature="feature.media">Photos</a>
      <a href="games.html" data-guest-link data-icon="🎲" data-i18n="nav.games" data-feature="feature.games" class="current">Games</a>

  <main>

    </section>

      <h2 data-i18n="game.title">Games</h2>
      <p class="muted" data-i18n="game.intro"></p>
      <div id="games"></div>
    </section>

    <section class="card">
      <h2 data-i18n="game.top">Top players</h2>
      <ol id="top" class="leader"></ol>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
